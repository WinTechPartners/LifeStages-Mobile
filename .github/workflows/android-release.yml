name: LifeStages Android release
on:
  workflow_dispatch:
    inputs:
      reuse_build_run:
        type: string
        default: ''
  workflow_call:
    inputs:
      reuse_build_run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.reuse_build_run }}
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_API_BASE_URL: https://www.bibleforlifestages.com
      NEXT_TELEMETRY_DISABLED: '1'
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_NATIVE_BUILD: '1'
      ANDROID_KEY_ALIAS: lifestages-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mobile
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs
      - name: Build installable testing APK and release bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_UPLOAD_KEY_BASE64" || { echo 'Android upload signing key is missing'; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/lifestages-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEY_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease lintDebug --stacktrace
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: LifeStages-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeStages-Android-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeStages-Android-Build-Reports
          path: android/app/build/reports
  phone-smoke:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.reuse_build_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LifeStages-Android-Test-APK
          path: test-apk
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: python3 scripts/android-phone-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeStages-Android-Phone-API-${{ matrix.api }}
          path: build/android-phone

name: LifeStages signed iPhone release
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect for TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lifestages-appstore
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_API_BASE_URL: https://www.bibleforlifestages.com
      NEXT_TELEMETRY_DISABLED: '1'
      APPLE_TEAM_ID: LLWKD27S4H
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install native project tools
        run: gem install cocoapods xcodeproj --no-document
      - name: Verify release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "Missing release configuration: $name"; exit 1; fi
          done
          xcodebuild -version
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          [ "${version%%.*}" -ge 26 ] || { echo 'iOS SDK 26 or later required'; exit 1; }
      - name: Install and verify source
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
      - name: Use the existing Apple app identifier
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'capacitor.config.ts';
          let text = fs.readFileSync(file, 'utf8');
          if (!/appId:\s*['"](?:com\.lifestagesai\.bible|com\.bibleforlifestages)['"]/.test(text)) throw Error('Unexpected source bundle ID');
          text = text.replace(/appId:\s*['"](?:com\.lifestagesai\.bible|com\.bibleforlifestages)['"]/, "appId: 'com.bibleforlifestages'");
          fs.writeFileSync(file, text);
          NODE
      - name: Build the bundled app
        run: |
          npm run build:mobile
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          ruby scripts/configure-storekit.rb
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string LifeStages uses your microphone when you choose voice chat.' ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c 'Set :NSMicrophoneUsageDescription LifeStages uses your microphone when you choose voice chat.' ios/App/App/Info.plist
      - name: Prepare the approved Apple authentication key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_PRIVATE_KEY" || { echo 'Apple signing key is missing'; exit 1; }
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive for real iPhones with automatic signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/LifeStages.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER=com.bibleforlifestages \
            CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION=1.0 archive
      - name: Export or upload the signed build
        env:
          UPLOAD: ${{ inputs.upload }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {'method':'app-store-connect', 'destination':'upload' if os.environ['UPLOAD']=='true' else 'export', 'teamID':os.environ['APPLE_TEAM_ID'], 'signingStyle':'automatic', 'manageAppVersionAndBuildNumber':True, 'uploadSymbols':True}
          with open('build/ExportOptions.plist','wb') as f: plistlib.dump(options,f)
          PY
          xcodebuild -exportArchive -archivePath build/LifeStages.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeStages-signed-iPhone-${{ github.run_number }}
          path: |
            build/export/**
            build/LifeStages.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7
      - name: Remove the temporary authentication key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
